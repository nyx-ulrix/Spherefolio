<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Interactive 3D sphere and terminal portfolio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='none' stroke='%23ff6400' stroke-width='2'/><ellipse cx='12' cy='12' rx='4' ry='9' fill='none' stroke='%23ff6400' stroke-width='1.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Signika:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body class="site">
<section id="sphere-panel" class="panel" aria-label="Projects sphere">
  <header><b id="caption">Projects · drag to spin, click a frame</b><span id="status" class="dim"></span></header>
  <main id="stage"><div id="sphere"></div></main>
</section>

<section id="about" class="panel" aria-label="About me">
  <header><b>About me</b><a id="gm" class="btn" href="/admin/" hidden>GM dashboard</a></header>
  <div class="body" id="about-body"></div>
</section>

<section id="term" class="panel" aria-label="Terminal">
  <header><b>Terminal · visitor@sphere</b><span class="dim">type help</span></header>
  <div class="body">
    <div id="term-out" aria-live="polite"></div>
    <form id="term-form"><label for="term-in" class="hl">visitor@sphere:~$</label><input id="term-in" autocomplete="off" autocapitalize="off" spellcheck="false"></form>
  </div>
</section>
</body>
</html>
