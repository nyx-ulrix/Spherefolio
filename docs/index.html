<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='none' stroke='%23ff0490' stroke-width='2'/><ellipse cx='12' cy='12' rx='4' ry='9' fill='none' stroke='%23ff0490' stroke-width='1.5'/></svg>">

<link rel="stylesheet" href="style.css">
<script>/* before first paint: the view the visitor was last in (Developer mode or the Spiral view) and that view's
   theme. Each view keeps its own light/dark choice; the Spiral view starts light, Developer mode dark. */
(() => { let s = {}; try { s = localStorage } catch {}
  const view = location.hash === '#dev' || s.view === 'dev' ? 'dev' : 'spiral';
  document.documentElement.dataset.view = view;
  document.documentElement.dataset.theme = s['theme-' + view] || (view === 'dev' ? 'dark' : 'light') })()</script>
<script type="module" src="app.js"></script>
</head>
<body class="site">
<script>if (document.documentElement.dataset.view === 'dev') document.body.classList.add('dev')</script>
<section id="spiral-panel" class="panel" aria-label="Projects">

  <div class="spiral-body">
    <main id="stage">
      <div class="words" aria-hidden="true"><span id="w1"></span><span id="w2"></span></div>
      <p id="mini"></p>
      <div id="spiral"></div>
      <div id="titles"><ol aria-label="Projects"></ol></div>
      <div id="count" aria-hidden="true"><span id="count-now">1</span><svg id="arrow" viewBox="0 0 24 96" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 0V95M1.5 83.5 12 95 22.5 83.5"/></svg><span id="count-all"></span></div>
    </main>
  </div>
</section>

<section id="about" class="panel" aria-label="About me">
  <header><b>About me</b><button class="btn theme-btn" id="theme" aria-label="Switch light or dark theme">Light mode</button><button class="x btn" id="about-close" aria-label="Close About me"></button></header>
  <div class="body" id="about-body"></div>
</section>

<section id="term" class="panel" aria-label="Terminal">
  <header><b>Terminal · visitor@portfolio</b><span class="dim">type help</span><button class="btn" id="spiral-btn" aria-label="Back to the Spiral view">Spiral view</button></header>
  <div class="body">
    <div id="term-out" aria-live="polite"></div>
    <form id="term-form"><label for="term-in" class="hl">visitor@portfolio:~$</label><input id="term-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="click for suggestions"></form>
    <div id="suggest" aria-label="Suggested commands" hidden></div>
  </div>
</section>
</body>
</html>
