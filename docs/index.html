<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Interactive 3D sphere and terminal portfolio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='none' stroke='%23ff6400' stroke-width='2'/><ellipse cx='12' cy='12' rx='4' ry='9' fill='none' stroke='%23ff6400' stroke-width='1.5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Signika:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body data-mode="start">
<main id="stage" aria-label="Project sphere, drag to rotate"><div id="sphere"></div></main>

<section id="term" aria-label="Terminal">
  <div id="term-out" aria-live="polite"></div>
  <form id="term-form"><label for="term-in" class="hl">visitor@sphere:~$</label><input id="term-in" autocomplete="off" autocapitalize="off" spellcheck="false"></form>
</section>

<nav id="controls" aria-label="View">
  <button class="ctl" data-view="sphere" title="Sphere view" aria-label="Sphere view"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button>
  <button class="ctl" data-view="term" title="Terminal view" aria-label="Terminal view"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg></button>
</nav>
<nav id="scene-nav" aria-label="Scene"></nav>
<nav id="sidebar" aria-label="Sidebar">
  <button class="ctl" data-win="projects" title="Projects" aria-label="Projects"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
  <button class="ctl" data-win="profile" title="Profile &amp; resume" aria-label="Profile and resume"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
  <a class="ctl" id="gm" href="/admin/" title="GM dashboard" aria-label="GM dashboard" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></a>
</nav>
<footer id="hotbar" aria-label="Hotbar"><div id="slots"></div></footer>
<div id="status">● VISITOR</div>

<div id="start">
  <div class="start-card">
    <div class="kicker">Spherefolio · Join session</div>
    <h1 id="start-name"></h1>
    <p id="start-role" class="muted"></p>
    <div class="start-btns">
      <button data-view="sphere"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>Sphere<small>drag to explore · S</small></button>
      <button data-view="term"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>Terminal<small>type to explore · T</small></button>
    </div>
    <small class="muted">Switch views any time from the top-left controls.</small>
  </div>
</div>
</body>
</html>
